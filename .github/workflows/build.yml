name: Build Luna
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Скачать модель Qwen 2.5 1.5B
        run: |
          mkdir -p app/src/main/assets
          curl -L -o app/src/main/assets/qwen2.5-1.5b-instruct-q4_k_m.gguf "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать APK
        run: gradle :app:assembleDebug

      - name: Выложить APK
        uses: actions/upload-artifact@v4
        with:
          name: Luna-APK
          path: app/build/outputs/apk/debug/app-debug.apk
